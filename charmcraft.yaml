name: authorization-service
type: charm
title: Charmed Authorization Service
summary: Policy decision point for the Canonical centralized identity solution.
description: |
  Charmed Operator for Authorization Service, a policy decision point for the Canonical centralized identity solution.
links:
  documentation: https://canonical-identity.readthedocs-hosted.com
  source: https://github.com/canonical/authorization-service-operator
  issues: https://github.com/canonical/authorization-service-operator/issues
assumes:
  - k8s-api

containers:
  authorization-service:
    resource: oci-image
resources:
  oci-image:
    type: oci-image
    description: Authorization Token Service oci-image
    upstream-source: ghcr.io/canonical/authorization-service:v2.0.3

config:
  options:
    log_level:
      description: |
        The verbosity of logs produced by Authorization Service Server.
        Available values are: debug, info, warn, error.
      type: string
      default: "info"
    dev:
      type: boolean
      default: false
      description: Enable development mode.
    http_proxy:
      type: string
      description: HTTP proxy URL.
    https_proxy:
      type: string
      description: HTTPS proxy URL.
    no_proxy:
      type: string
      description: Comma-separated list of domains excluded from proxying.
    cpu:
      type: string
      description: Kubernetes CPU resource limit/request (e.g. "500m").
    memory:
      type: string
      description: Kubernetes memory resource limit/request (e.g. "256Mi").

requires:
  pg-database:
    interface: postgresql_client
    limit: 1
  openfga:
    interface: openfga
    limit: 1
  ingress:
    interface: istio_ingress_route
    limit: 1
  sts-info:
    interface: sts_info
    limit: 1
  tracing:
    interface: tracing
    limit: 1

provides:
  forward-auth:
    interface: forward_auth
  logging:
    interface: loki_push_api
  grafana-dashboard:
    interface: grafana_dashboard
  authorization-service-info:
    interface: authorization_service_info

actions:
  run-migration:
    description: Run pending database migrations. Must be executed on the leader unit.

peers:
  authorization-service-peers:
    interface: authorization_service_peers

platforms:
  ubuntu@22.04:amd64:
  ubuntu@26.04:amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
