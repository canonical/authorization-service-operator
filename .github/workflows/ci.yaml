name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
   workflow_dispatch:
   push:
     branches:
     - "main"
     - "release-**"
     - "track/**"
     paths-ignore:
     - "terraform/**"
   pull_request:
     branches:
     - "*"
     paths-ignore:
     - "terraform/**"

jobs:
  tests:
    name: CI
    permissions:
      contents: read
      packages: read
    secrets:
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_PAT: ${{ secrets.GH_PAT }}
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@5830f3e6723de07cb5b7ccb6c84031d8b2964c62 # v1.11.4
    with:
      container-name: "authorization-service"
      pytest-model-option: '--juju-model'
      juju-model-name: 'testing'
      # TODO: Enable when onboarded to charmcraft cache
      use-charmcraftcache: false
      node-size: large
